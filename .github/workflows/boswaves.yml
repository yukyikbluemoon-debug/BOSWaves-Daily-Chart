name: BOSWaves Daily Chart



on:
  schedule:
    - cron: '17 1 * * 1-5'   # 08:17
    - cron: '17 8 * * 1-5'   # 15:17
    - cron: '17 13 * * 1-5'  # 20:17
    - cron: '17 3 * * 6'     # 10:17
  workflow_dispatch:
    inputs:
      send_chart:
        description: 'ส่งกราฟ'
        default: 'true'
      send_news:
        description: 'ส่งข่าว'
        default: 'true'
      send_daily:
        description: 'ส่ง Daily Summary'
        default: 'true'

jobs:
  run-boswaves:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-thai-tlwg fonts-dejavu
          fc-cache -fv

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run BOSWaves
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SEND_CHART:        ${{ github.event.inputs.send_chart || 'true' }}
          SEND_NEWS:         ${{ github.event.inputs.send_news  || 'true' }}
          SEND_DAILY:        ${{ github.event.inputs.send_daily || 'true' }}
        run: python create_boswaves_v8.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boswaves-output-${{ github.run_number }}
          path: |
            output/*.png
            output/logs/*.log
          retention-days: 7
