name: BOSWaves Daily Chart

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 08:00 ไทย
    - cron: '0 8 * * 1-5'    # 15:00 ไทย
    - cron: '0 20 * * 1-5'   # 03:00 ไทย (วันถัดไป)
    - cron: '0 3 * * 6'      # 10:00 ไทย เสาร์ (ทดสอบ)
  workflow_dispatch:

jobs:
  run-boswaves:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-thai-tlwg fonts-dejavu
          fc-cache -fv

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run BOSWaves
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SEND_CHART = os.getenv("SEND_CHART", "true").lower() == "true"
          SEND_NEWS  = os.getenv("SEND_NEWS",  "true").lower() == "true"
          SEND_DAILY = os.getenv("SEND_DAILY", "true").lower() == "true"
        run: python create_boswaves_v8.py

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boswaves-output-${{ github.run_number }}
          path: |
            output/*.png
            output/logs/*.log
          retention-days: 7
