<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BOSWaves ตั้งค่า</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0E14;--card:#141820;--border:#2A2F3E;--accent:#3ECF8E;--accent2:#1a6644;--text:#E8EAF0;--muted:#6B7280;--danger:#FF5A5A;--warn:#F6C90E}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 80px}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.topbar span{font-size:12px;color:var(--muted)}
.body{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:480px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:13px;cursor:pointer;background:transparent;color:var(--muted);user-select:none;transition:.15s}
.chip.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.inp-row{display:flex;gap:7px;margin-top:10px}
.inp-row input{flex:1;background:#1e2330;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 10px}
.inp-row input::placeholder{color:var(--muted)}
.btn-sm{padding:7px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;cursor:pointer;white-space:nowrap}
.btn-sm:active{background:var(--accent2)}
.sched-item{display:grid;grid-template-columns:72px 1fr 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.sched-item:last-child{border-bottom:none}
.time-lbl{font-size:13px;font-weight:500}
.mini-wrap{display:flex;gap:5px}
.mini{font-size:12px;padding:4px 8px;border-radius:20px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--muted);user-select:none}
.mini.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--danger);background:#2a1515}
.time-add{display:flex;gap:7px;margin-top:10px}
.time-add input[type=time]{flex:1;background:#1e2330;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 10px}
.recip-item{display:grid;grid-template-columns:1fr 48px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.recip-item:last-child{border-bottom:none}
.recip-name{font-size:13px;font-weight:500}
.recip-id{font-size:11px;color:var(--muted);font-family:monospace}
.sw{position:relative;width:42px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw-track{position:absolute;inset:0;border-radius:12px;background:var(--border);transition:.2s;cursor:pointer}
.sw input:checked+.sw-track{background:var(--accent)}
.sw-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;pointer-events:none}
.sw input:checked~.sw-thumb{left:21px}
.recip-add{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.recip-add input{background:#1e2330;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 10px;width:100%}
.recip-add input::placeholder{color:var(--muted)}
.btn-block{width:100%;padding:9px;border-radius:8px;border:1px solid;font-size:13px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-test{border-color:#2E7D52;background:#0d2b1e;color:var(--accent)}
.btn-test:active{background:#1a3d2a}
.slider-wrap{margin-bottom:10px}
.slider-wrap:last-child{margin-bottom:0}
.slider-hd{display:flex;justify-content:space-between;margin-bottom:6px}
.slider-hd span{font-size:13px;color:var(--muted)}
.slider-hd strong{font-size:13px;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent);height:4px}
.save-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--border)}
.btn-save{width:100%;max-width:480px;display:block;margin:0 auto;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#000;font-size:15px;font-weight:600;cursor:pointer}
.btn-save:active{opacity:.85}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0d2b1e;border:1px solid var(--accent);color:var(--accent);padding:8px 20px;border-radius:20px;font-size:13px;display:none;z-index:100;white-space:nowrap}
.status{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
</style>
</head>
<body>

<div class="topbar">
  <span>📈</span>
  <h1>BOSWaves ตั้งค่า</h1>
  <span id="conn-status">กำลังโหลด...</span>
</div>

<div class="body">
  <div class="card">
    <div class="card-title">หุ้น / ETF</div>
    <div class="chip-wrap" id="ticker-group"></div>
    <div class="inp-row">
      <input id="ticker-inp" placeholder="เพิ่ม เช่น QQQ" maxlength="6">
      <button class="btn-sm" onclick="addTicker()">+ เพิ่ม</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">รอบส่ง (จันทร์–ศุกร์)</div>
    <div id="sched-list"></div>
    <div class="time-add">
      <input type="time" id="new-time" value="12:00">
      <button class="btn-sm" onclick="addSched()">+ เพิ่มรอบ</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">ผู้รับ Telegram</div>
    <div id="recip-list"></div>
    <div class="recip-add">
      <input id="rname" placeholder="ชื่อ เช่น เพื่อน A">
      <input id="rid" placeholder="Chat ID เช่น 9876543210">
      <button class="btn-sm" onclick="addRecip()" style="width:100%;padding:8px">+ เพิ่มผู้รับ</button>
    </div>
    <button class="btn-block btn-test" id="test-btn" onclick="testSend()">
      ✉️ ทดสอบส่งให้ทุกคน
    </button>
  </div>

  <div class="card">
    <div class="card-title">Gemini AI</div>
    <div class="chip-wrap" id="gemini-group">
      <div class="chip" data-v="translate">แปลข่าว</div>
      <div class="chip" data-v="sentiment">วิเคราะห์ข่าว</div>
      <div class="chip" data-v="summary">สรุปภาพรวม</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">แจ้งเตือน RSI</div>
    <div class="slider-wrap">
      <div class="slider-hd">
        <span>🔥 ราคาร้อนแรงเกินไป (Overbought)</span>
        <strong id="ob-v">70</strong>
      </div>
      <input type="range" id="ob" min="60" max="90" value="70" step="1"
             oninput="document.getElementById('ob-v').textContent=this.value">
    </div>
    <div class="slider-wrap">
      <div class="slider-hd">
        <span>💎 ราคาถูกผิดปกติ (Oversold)</span>
        <strong id="os-v">30</strong>
      </div>
      <input type="range" id="os" min="10" max="40" value="30" step="1"
             oninput="document.getElementById('os-v').textContent=this.value">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="save-bar">
  <button class="btn-save" onclick="saveConfig()">💾 บันทึกการตั้งค่า</button>
  <div class="status" id="save-status"></div>
</div>

<script>
const SUPABASE_URL = 'https://acfwyzfntiuackcnarvo.supabase.co'
const SERVICE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZnd5emZudGl1YWNrY25hcnZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjkzMTEsImV4cCI6MjEwNDYwNTMxMX0.WcfGuDP6geA_ug3v1RYy0fVDLKhizaTKfL-8bky4wRQ'

const hdr = {
  'apikey': SERVICE_KEY,
  'Authorization': 'Bearer ' + SERVICE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
}

let state = {
  tickers:        ['VOO','NVDA','JEPQ'],
  schedules:      [
    {time:'08:00',chart:true, news:true, daily:true },
    {time:'15:00',chart:false,news:true, daily:false},
    {time:'03:00',chart:true, news:false,daily:true }
  ],
  gemini:         {translate:true,sentiment:true,summary:false},
  rsi_overbought: 70,
  rsi_oversold:   30,
  bot_token:      '',
  recipients:     []
}

async function init(){
  try {
    const [cfgRes, recRes] = await Promise.all([
      fetch(SUPABASE_URL+'/rest/v1/boswaves_config?id=eq.1&select=*', {headers:hdr}),
      fetch(SUPABASE_URL+'/rest/v1/boswaves_recipients?select=*&order=id', {headers:hdr})
    ])
    if(!cfgRes.ok) throw new Error('Config load failed: '+cfgRes.status)
    const cfgRows = await cfgRes.json()
    const recRows = await recRes.json()
    if(cfgRows.length){
      const c = cfgRows[0]
      if(c.tickers)        state.tickers        = c.tickers
      if(c.schedules)      state.schedules      = c.schedules
      if(c.gemini)         state.gemini         = c.gemini
      if(c.rsi_overbought) state.rsi_overbought = c.rsi_overbought
      if(c.rsi_oversold)   state.rsi_oversold   = c.rsi_oversold
      if(c.bot_token)      state.bot_token      = c.bot_token
    }
    state.recipients = recRows || []
    document.getElementById('conn-status').textContent = '🟢 เชื่อมต่อแล้ว'
  } catch(e){
    document.getElementById('conn-status').textContent = '🔴 ไม่ได้เชื่อมต่อ'
    showToast('โหลดไม่ได้: '+e.message)
  }
  renderAll()
}

function renderAll(){
  renderTickers()
  renderScheds()
  renderRecips()
  renderGemini()
  document.getElementById('ob').value     = state.rsi_overbought
  document.getElementById('ob-v').textContent = state.rsi_overbought
  document.getElementById('os').value     = state.rsi_oversold
  document.getElementById('os-v').textContent = state.rsi_oversold
}

function renderTickers(){
  const g = document.getElementById('ticker-group')
  g.innerHTML = ''
  state.tickers.forEach(function(t){
    const d = document.createElement('div')
    d.className = 'chip on'
    d.textContent = t
    d.onclick = function(){ state.tickers = state.tickers.filter(function(x){return x!==t}); renderTickers() }
    g.appendChild(d)
  })
}

function addTicker(){
  const v = document.getElementById('ticker-inp').value.trim().toUpperCase()
  if(!v || state.tickers.indexOf(v)>=0) return
  state.tickers.push(v)
  renderTickers()
  document.getElementById('ticker-inp').value = ''
}
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement.id==='ticker-inp') addTicker()
})

function renderScheds(){
  const el = document.getElementById('sched-list')
  el.innerHTML = ''
  state.schedules.forEach(function(s, i){
    const h = parseInt(s.time)
    const icon = h<12 ? '🌅' : h<18 ? '🕐' : '🌙'

    const row  = document.createElement('div')
    row.className = 'sched-item'

    const lbl = document.createElement('span')
    lbl.className = 'time-lbl'
    lbl.textContent = icon+' '+s.time

    const wrap = document.createElement('div')
    wrap.className = 'mini-wrap'

    // สร้าง chip แต่ละตัวแยก — ไม่ใช้ template literal ใน onclick
    var keys = ['chart','news','daily']
    var labels = ['กราฟ','ข่าว','สรุป']
    keys.forEach(function(key, ki){
      const m = document.createElement('div')
      m.className = 'mini' + (s[key] ? ' on' : '')
      m.textContent = labels[ki]
      m.addEventListener('click', function(){
        state.schedules[i][key] = !state.schedules[i][key]
        m.classList.toggle('on', state.schedules[i][key])
      })
      wrap.appendChild(m)
    })

    const btn = document.createElement('button')
    btn.className = 'del'
    btn.textContent = '🗑'
    btn.addEventListener('click', function(){
      state.schedules.splice(i, 1)
      renderScheds()
    })

    row.appendChild(lbl)
    row.appendChild(wrap)
    row.appendChild(btn)
    el.appendChild(row)
  })
}

function addSched(){
  const t = document.getElementById('new-time').value
  if(!t) return
  state.schedules.push({time:t,chart:true,news:true,daily:true})
  renderScheds()
}

function renderRecips(){
  const el = document.getElementById('recip-list')
  el.innerHTML = ''
  state.recipients.forEach(function(r, i){
    const row = document.createElement('div')
    row.className = 'recip-item'
    const masked = r.chat_id.length>4 ? r.chat_id.slice(0,-4)+'****' : r.chat_id

    const info = document.createElement('div')
    info.innerHTML = '<div class="recip-name">'+r.name+'</div><div class="recip-id">'+masked+'</div>'

    const sw = document.createElement('label')
    sw.className = 'sw'
    const chk = document.createElement('input')
    chk.type = 'checkbox'
    chk.checked = !!r.active
    chk.addEventListener('change', function(){ state.recipients[i].active = chk.checked })
    sw.appendChild(chk)
    sw.innerHTML += '<div class="sw-track"></div><div class="sw-thumb"></div>'

    const del = document.createElement('button')
    del.className = 'del'
    del.textContent = '🗑'
    del.addEventListener('click', function(){ delRecip(i) })

    row.appendChild(info)
    row.appendChild(sw)
    row.appendChild(del)
    el.appendChild(row)
  })
}

async function delRecip(i){
  const r = state.recipients[i]
  if(r.id){
    await fetch(SUPABASE_URL+'/rest/v1/boswaves_recipients?id=eq.'+r.id, {method:'DELETE',headers:hdr})
  }
  state.recipients.splice(i,1)
  renderRecips()
}

async function addRecip(){
  const name    = document.getElementById('rname').value.trim()
  const chat_id = document.getElementById('rid').value.trim()
  if(!name||!chat_id){ showToast('กรุณาใส่ชื่อและ Chat ID'); return }
  try {
    const res  = await fetch(SUPABASE_URL+'/rest/v1/boswaves_recipients',
      {method:'POST', headers:hdr, body:JSON.stringify({name:name,chat_id:chat_id,active:true})})
    const rows = await res.json()
    state.recipients.push(rows[0] || {name:name,chat_id:chat_id,active:true})
    renderRecips()
    document.getElementById('rname').value = ''
    document.getElementById('rid').value   = ''
    showToast('เพิ่มผู้รับสำเร็จ ✓')
  } catch(e){ showToast('เพิ่มไม่ได้: '+e.message) }
}

function renderGemini(){
  document.querySelectorAll('#gemini-group .chip').forEach(function(c){
    c.classList.toggle('on', !!state.gemini[c.dataset.v])
    c.onclick = function(){
      state.gemini[c.dataset.v] = !state.gemini[c.dataset.v]
      c.classList.toggle('on', state.gemini[c.dataset.v])
    }
  })
}

async function testSend(){
  const btn = document.getElementById('test-btn')
  btn.textContent = '⏳ กำลังส่ง...'
  btn.disabled = true
  const botToken    = state.bot_token || ''
  const activeRecips = state.recipients.filter(function(r){ return r.active })
  if(!botToken || activeRecips.length===0){
    showToast('ไม่มีผู้รับหรือ Bot Token')
    btn.textContent = '✉️ ทดสอบส่งให้ทุกคน'
    btn.disabled = false
    return
  }
  var ok = 0
  for(var ri=0; ri<activeRecips.length; ri++){
    try {
      const res = await fetch(
        'https://api.telegram.org/bot'+botToken+'/sendMessage',
        {method:'POST', headers:{'Content-Type':'application/json'},
         body:JSON.stringify({
           chat_id: activeRecips[ri].chat_id,
           text: '✅ BOSWaves ทดสอบส่งสำเร็จ!\nผู้รับ: '+activeRecips[ri].name+'\nเวลา: '+new Date().toLocaleString('th-TH')
         })})
      if(res.ok) ok++
    } catch(e){}
  }
  showToast(ok>0 ? 'ส่งสำเร็จ '+ok+'/'+activeRecips.length+' คน ✓' : 'ส่งไม่ได้ ตรวจสอบ Token')
  btn.textContent = '✉️ ทดสอบส่งให้ทุกคน'
  btn.disabled = false
}

async function saveConfig(){
  const btn = document.querySelector('.btn-save')
  btn.textContent = '💾 กำลังบันทึก...'
  btn.disabled = true
  try {
    const cfgBody = {
      tickers:        state.tickers,
      schedules:      state.schedules,
      gemini:         state.gemini,
      rsi_overbought: parseInt(document.getElementById('ob').value),
      rsi_oversold:   parseInt(document.getElementById('os').value),
      updated_at:     new Date().toISOString()
    }
    await fetch(SUPABASE_URL+'/rest/v1/boswaves_config?id=eq.1',
      {method:'PATCH', headers:hdr, body:JSON.stringify(cfgBody)})

    for(var ri=0; ri<state.recipients.length; ri++){
      const r = state.recipients[ri]
      if(r.id){
        await fetch(SUPABASE_URL+'/rest/v1/boswaves_recipients?id=eq.'+r.id,
          {method:'PATCH', headers:hdr, body:JSON.stringify({active:r.active})})
      }
    }
    document.getElementById('save-status').textContent = 'บันทึกเมื่อ '+new Date().toLocaleTimeString('th-TH')
    showToast('บันทึกสำเร็จ ✓')
  } catch(e){
    showToast('บันทึกไม่ได้: '+e.message)
  }
  btn.textContent = '💾 บันทึกการตั้งค่า'
  btn.disabled = false
}

function showToast(msg){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.display = 'block'
  setTimeout(function(){ t.style.display='none' }, 3000)
}

init()
</script>
</body>
</html>
